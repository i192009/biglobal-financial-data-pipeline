global:
  scrape_interval: 10s
scrape_configs:
  - job_name: source-api
    static_configs: [{targets: ['trading-api:8080']}]
  - job_name: cdc-consumer
    static_configs: [{targets: ['cdc-consumer:8081']}]
  - job_name: analytics-api
    static_configs: [{targets: ['analytics-api:8082']}]
  - job_name: reconciliation
    static_configs: [{targets: ['reconciliation:8091']}]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{targets: ['redpanda:9644']}]
rule_files: [/etc/prometheus/alerts.yml]
