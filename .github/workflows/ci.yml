name: Financial platform checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.11', cache: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: reconciliation/requirements.txt}
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: pip install -r reconciliation/requirements.txt
      - run: ruff check reconciliation scripts tests
      - run: python -m pytest -q
      - run: dbt parse --project-dir dbt/financial_analytics --profiles-dir dbt/financial_analytics
      - run: docker compose config --quiet
  real-cdc-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: python scripts/acceptance.py --events 10000
      - name: Real PostgreSQL Go transactional tests
        run: >-
          docker run --rm --network biglobal-financial-data-pipeline_default
          -v "$PWD:/src" -w /src
          -e TEST_SOURCE_DSN='postgres://source_app:source-local@source-db:5432/source?sslmode=disable'
          -e TEST_ANALYTICS_DSN='postgres://ingest_app:ingest-local@analytics-db:5432/warehouse?sslmode=disable'
          golang:1.26.11-bookworm go test -race -count=1 ./internal/ledger ./internal/consumers
      - run: python scripts/failure_tests.py
      - run: docker compose run --rm dbt python /app/scripts/run_dbt.py source freshness
      - if: always()
        run: docker compose logs --no-color > benchmarks/compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-platform-evidence
          path: |
            benchmarks/
            dbt/financial_analytics/target/run_results.json
      - if: always()
        run: docker compose down
